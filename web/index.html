<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>CinePosto</title>
  <meta name="description" content="" data-i18n-attr="content:app.description" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon_lens.svg" />
  <!-- The color of the header: js/app.js keeps it in step with the theme. -->
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('cineposto-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <!-- One file per theme; CSS shows the one that matches data-theme, so the manual toggle works too. -->
      <span class="brand-mark">
        <img class="brand-logo brand-logo-for-dark" src="assets/cineposto_logo_v2.svg" alt="CinePosto" width="1200" height="352" />
        <img class="brand-logo brand-logo-for-light" src="assets/cineposto_logo_v2_light.svg" alt="CinePosto" width="1200" height="352" />
      </span>
    </a>
    <nav class="topnav" aria-label="" data-i18n-attr="aria-label:nav.main">
      <a href="#/" data-route="home"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg><span data-i18n="nav.home"></span></a>
      <a href="#/films" data-route="films"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.236 2.236 0 01.101.545l2.218 5.543a2.25 2.25 0 002.091 1.42h12.667a2.25 2.25 0 002.091-1.42l2.218-5.543a2.236 2.236 0 01.101-.545V6.375c0-.621-.504-1.125-1.125-1.125H3.375z"/></svg><span data-i18n="nav.films"></span></a>
      <a href="#/cinema" data-route="cinema"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/></svg><span data-i18n="nav.cinema"></span></a>
      <a href="#/mappa" data-route="mappa"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z"/></svg><span data-i18n="nav.map"></span></a>
    </nav>
    <div class="tb-search global-search">
      <span class="tb-search-icon" aria-hidden="true"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
      <input id="liveQ" type="search" placeholder="" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="liveResults"
        data-i18n-attr="placeholder:topbar.searchPlaceholder;aria-label:topbar.searchLabel" />
      <div id="liveResults" class="live-results" role="listbox" data-i18n-attr="aria-label:topbar.searchResults" hidden></div>
    </div>
    <button id="openFilters" class="icon-btn" data-i18n-attr="aria-label:topbar.openFilters"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/></svg></button>
    <button id="langToggle" class="icon-btn lang-btn" data-i18n="topbar.switchLanguageTo" data-i18n-attr="aria-label:topbar.toggleLanguage"></button>
    <button id="themeToggle" class="icon-btn" data-i18n-attr="aria-label:topbar.toggleTheme" aria-pressed="false"></button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="attrib">
    <p><span data-i18n="footer.artwork"></span> <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
    <span data-i18n="footer.disclaimer"></span></p>
  </footer>

  <dialog id="filtersDialog" class="filters-sheet" data-i18n-attr="aria-label:filters.title">
    <div class="sheet-head">
      <h2 data-i18n="filters.title"></h2>
      <button id="filtersClose" class="icon-btn" data-i18n-attr="aria-label:filters.close"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <h3 class="sheet-section" data-i18n="filters.sortBy"></h3>
    <ul id="sortList" class="sheet-list"></ul>
    <h3 class="sheet-section" data-i18n="filters.genre"></h3>
    <ul id="genreList" class="sheet-list"></ul>
    <h3 class="sheet-section" data-i18n="filters.cinema"></h3>
    <ul id="cinemaList" class="sheet-list"></ul>
  </dialog>

  <nav class="bottomnav" data-i18n-attr="aria-label:nav.mobile">
    <a href="#/" data-route="home"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg><span data-i18n="nav.home"></span></a>

    <a href="#/cerca" data-route="cerca"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span data-i18n="nav.search"></span></a>
    <a href="#/mappa" data-route="mappa"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z"/></svg><span data-i18n="nav.map"></span></a>
    <a href="#/cinema" data-route="cinema"><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/></svg><span data-i18n="nav.cinema"></span></a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
