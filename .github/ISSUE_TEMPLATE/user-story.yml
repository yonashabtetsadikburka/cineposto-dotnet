name: User Story
description: Capture a new feature request or product story.
title: ""
labels: ["user-story"]
body:
  - type: input
    id: as-a
    attributes:
      label: As a
      description: Who is the user, team, or role this story is for?
      placeholder: e.g. Registered user
    validations:
      required: true

  - type: textarea
    id: i-want
    attributes:
      label: I want
      description: What do you want to be able to do?
      placeholder: Describe the desired behavior or capability.
    validations:
      required: true

  - type: textarea
    id: so-that
    attributes:
      label: So that
      description: What problem does this solve or what value does it provide?
      placeholder: Explain the reason or outcome.
    validations:
      required: true

  - type: checklist
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Confirm the expected outcomes for this story.
      options:
        - label: A user can complete the intended flow without errors.
        - label: The feature behaves correctly for the main happy path.
        - label: Validation and error handling are clear and user-friendly.
        - label: The feature is accessible and works on supported devices/browsers.
        - label: Edge cases and failure scenarios are handled gracefully.

  - type: dropdown
    id: moscow-priority
    attributes:
      label: Priority (MoSCoW)
      description: Select the priority level for this story.
      options:
        - Must
        - Should
        - Could
        - Won't
    validations:
      required: true
