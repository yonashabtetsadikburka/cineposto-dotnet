# Workflow name shown in GitHub Actions.
name: CI

# Run for pull requests and pushes to main.
on:
  pull_request:
  push:
    branches:
      - main

# Grant only the read access required by checkout.
permissions:
  contents: read

# Cancel previous runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Run CI on a single Ubuntu job.
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore CinePosto.slnx

      - name: Build
        run: dotnet build CinePosto.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CinePosto.slnx --configuration Release --no-build --no-restore

      # The web frontend is plain JavaScript. Its unit tests use the test runner built into Node: no package is installed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the web frontend
        run: node --no-warnings --test "web/tests/*.test.mjs"

  # Builds the Docker images without pushing them, then runs the local smoke test: the api starts, the scraper
  # fills the database from saved fixtures and the main endpoints answer. No network or secrets are used.
  docker-smoke:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # docker-compose.yml requires ADMIN_TOKEN. A random one is made for this run only and never stored.
      - name: Create a throwaway admin token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "ADMIN_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build the images (not pushed)
        run: docker compose --profile jobs build

      # The script prints the logs of the failing service itself, then removes its containers and volume.
      - name: Smoke test
        run: bash scripts/smoke.sh
