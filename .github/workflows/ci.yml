# Workflow name shown in GitHub Actions.
name: CI

# Run for pull requests and pushes to main.
on:
  pull_request:
  push:
    branches:
      - main

# Grant only the read access required by checkout.
permissions:
  contents: read

# Cancel previous runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Run CI on a single Ubuntu job.
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore CinePosto.slnx

      - name: Build
        run: dotnet build CinePosto.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CinePosto.slnx --configuration Release --no-build --no-restore
